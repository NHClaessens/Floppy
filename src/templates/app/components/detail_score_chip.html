
{% load i18n %}
{% load l10n %}
{% load app_tags %}

<div id="detail-score-chip-{{ current_instance.id }}"
     {% if score_chip_oob %}hx-swap-oob="outerHTML"{% endif %}
     x-data="{ showRatingPopup: false, rating: {% localize off %}{{ current_instance.score|score_display:user|default:'null' }}{% endlocalize %}, ratingScaleMax: {{ user|rating_scale_max }}, hoverRating: null, isHovering: false, showCoverage: false, formatRating(value) { if (value === null || value === undefined || value === '') { return ''; } return this.ratingScaleMax === 5 ? String(value) + '/5' : String(value); } }"
     class="relative min-w-0 sm:w-auto">
  <button type="button"
          @click="showRatingPopup = !showRatingPopup"
          {% if derived_tv_score.score is not None %}data-derived-tv-detail-rating="{{ derived_tv_score.label }}" title="{{ derived_tv_score.title }}" @mouseenter="showCoverage = true" @mouseleave="showCoverage = false" @focus="showCoverage = true" @blur="showCoverage = false"{% endif %}
          class="inline-flex h-[1.875rem] min-w-0 items-center gap-0.5 overflow-hidden rounded-full border border-amber-400/18 bg-amber-500/[0.07] pl-0 pr-1.5 text-[12px] text-white shadow-sm transition-colors duration-200 hover:border-amber-300/28 hover:bg-amber-500/[0.11] sm:h-8 sm:gap-2 sm:pr-3 sm:text-sm">
    {% if derived_tv_score.score is None %}<span class="sr-only">{% translate "Your score" %}</span>{% endif %}
    <span class="-my-px -ml-px flex h-[1.875rem] w-[1.875rem] shrink-0 items-center justify-center rounded-full border border-amber-400/28 bg-amber-500/14 sm:h-8 sm:w-8">
      {% include "app/icons/star.svg" with classes="h-3.5 w-3.5 text-yellow-400 fill-yellow-400 sm:h-4 sm:w-4" %}
    </span>
    {% if derived_tv_score.score is not None %}
      {# Episode-derived score exists: show it beside the manual score, or on its own. #}
      <span class="inline-flex items-center gap-1 whitespace-nowrap sm:gap-2">
        {% if current_instance.score is not None %}
          <span class="sr-only">{% translate "Your score" %}</span>
          <span class="text-[12px] font-semibold text-[var(--color-text)] sm:text-sm">{% if user|rating_scale_max == 5 %}{{ current_instance.score|score_display:user }}/5{% else %}{{ current_instance.score|score_display:user }}{% endif %}</span>
          <span class="text-[12px] text-[var(--color-text-muted)] sm:text-sm">|</span>
          <span class="sr-only">{% translate "Derived rating" %}</span>
          <span class="inline-flex items-center text-[12px] font-medium text-[var(--color-text-secondary)] sm:text-sm">{{ derived_tv_score.score|floatformat:"-1" }}<span data-derived-coverage
                  class="inline-block overflow-hidden whitespace-nowrap"
                  style="max-width: 0; opacity: 0; transition: max-width 320ms cubic-bezier(0.22, 1, 0.36, 1), opacity 260ms ease-out"
                  :style="showCoverage ? { maxWidth: '12rem', opacity: 1 } : { maxWidth: '0', opacity: 0 }">&nbsp;· {% include "app/components/derived_tv_rating_coverage.html" with derived_tv_score=derived_tv_score only %}</span></span>
        {% else %}
          <span class="sr-only">{% translate "Derived rating" %}</span>
          <span class="text-[12px] font-semibold text-[var(--color-text)] sm:text-sm">{{ derived_tv_score.score|floatformat:"-1" }}</span>
          <span class="text-[12px] text-[var(--color-text-muted)] sm:text-sm">|</span>
          <span class="text-[12px] font-medium text-[var(--color-text-secondary)] sm:text-sm">{% include "app/components/derived_tv_rating_coverage.html" with derived_tv_score=derived_tv_score only %}</span>
        {% endif %}
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1 whitespace-nowrap sm:gap-2">
        <span class="text-[12px] font-semibold text-[var(--color-text)] sm:text-sm {% if current_instance.score is None %}hidden{% endif %}"
              :class="rating ? '' : 'hidden'"
              x-text="formatRating(rating)">{% if current_instance.score is not None %}{% if user|rating_scale_max == 5 %}{{ current_instance.score|score_display:user }}/5{% else %}{{ current_instance.score|score_display:user }}{% endif %}{% endif %}</span>
        <span class="text-[12px] text-[var(--color-text-muted)] sm:text-sm {% if current_instance.score is None %}hidden{% endif %}"
              :class="rating ? '' : 'hidden'">|</span>
        {% translate "Edit rating" as media_i18n_34 %}{% translate "Add rating" as media_i18n_35 %}<span class="text-[12px] font-medium text-[var(--color-text-secondary)] sm:text-sm"
              x-text="rating ? '{{ media_i18n_34|escapejs }}' : '{{ media_i18n_35|escapejs }}'">{% if current_instance.score is not None %}{% translate "Edit rating" %}{% else %}{% translate "Add rating" %}{% endif %}</span>
      </span>
    {% endif %}
  </button>

  <div x-show="showRatingPopup"
       @click.outside="showRatingPopup = false; isHovering = false"
       class="absolute left-0 top-full mt-2 w-[250px] rounded-lg border border-gray-700 bg-[var(--color-surface)] p-3 shadow-lg z-10"
       @mouseenter="isHovering = true"
       @mouseleave="isHovering = false; hoverRating = null">
    {% url 'update_media_score' media_type current_instance.id as rating_post_url %}
    {% include "app/components/rating_picker.html" with post_url=rating_post_url %}
  </div>
</div>
