{% load i18n %}

{% translate " selected" as bulk_selected_suffix %}
<div x-show="selectMode"
     x-cloak
     class="flex flex-wrap items-center gap-3 mb-4 p-3 rounded-md bg-[var(--color-surface-strong)]">
  <span class="text-sm text-[var(--color-text-secondary)]"
        x-text="selectedItemIds.length + '{{ bulk_selected_suffix|escapejs }}'"></span>

  <div class="relative" x-data="{ open: false }" @click.outside="open = false">
    <button type="button"
            class="px-3 py-1.5 rounded-md text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-wait"
            :disabled="selectedItemIds.length === 0 || bulkLoading"
            @click="open = !open">
      {% translate "Update Status" %}
    </button>
    <div x-show="open"
         x-cloak
         class="absolute z-40 mt-2 w-48 bg-[var(--color-surface-strong)] rounded-md shadow-lg overflow-hidden border border-gray-700">
      <template x-for="status in bulkStatuses" :key="status.value">
        <button type="button"
                class="block w-full px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
                @click="open = false; bulkStatusAction(status.value)"
                x-text="status.label"></button>
      </template>
    </div>
  </div>

  <div class="relative" x-data="{ open: false }" @click.outside="open = false">
    <button type="button"
            class="px-3 py-1.5 rounded-md text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-wait"
            :disabled="selectedItemIds.length === 0 || bulkLoading"
            @click="open = !open">
      {% translate "Add to List" %}
    </button>
    <div x-show="open"
         x-cloak
         class="absolute z-40 mt-2 w-56 bg-[var(--color-surface-strong)] rounded-md shadow-lg overflow-hidden border border-gray-700 max-h-64 overflow-y-auto">
      <template x-for="customList in bulkLists" :key="customList.id">
        <button type="button"
                class="block w-full px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
                @click="open = false; bulkListAction(customList.id)"
                x-text="customList.label"></button>
      </template>
      <p x-show="bulkLists.length === 0"
         class="px-3 py-2 text-sm text-[var(--color-text-muted)]">{% translate "No editable lists." %}</p>
    </div>
  </div>

  <button type="button"
          class="px-3 py-1.5 rounded-md text-sm bg-indigo-600 text-white hover:bg-indigo-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-wait"
          :disabled="selectedItemIds.length === 0 || bulkLoading"
          @click="bulkCollectionAction()">
    {% translate "Add to Collection" %}
  </button>

  <div class="relative" x-data="{ open: false }" @click.outside="open = false">
    <button type="button"
            class="px-3 py-1.5 rounded-md text-sm bg-violet-600 text-white hover:bg-violet-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-wait"
            :disabled="selectedItemIds.length === 0 || bulkLoading"
            @click="open = !open">{% translate "Apply Tag" %}</button>
    <div x-show="open"
         x-cloak
         class="absolute z-40 mt-2 w-56 bg-[var(--color-surface-strong)] rounded-md shadow-lg overflow-hidden border border-gray-700 max-h-64 overflow-y-auto">
      <template x-for="tag in bulkTags" :key="tag">
        <div class="flex items-center justify-between px-3 py-2 text-sm text-[var(--color-text-secondary)]">
          <span class="truncate max-w-[8rem]" x-text="tag"></span>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button"
                    class="px-2 py-0.5 rounded text-xs bg-[var(--color-surface)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
                    @click="open = false; bulkTagAction(tag, 'add')">{% translate "Add" %}</button>
            <button type="button"
                    class="px-2 py-0.5 rounded text-xs bg-[var(--color-surface)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
                    @click="open = false; bulkTagAction(tag, 'remove')">{% translate "Remove" %}</button>
          </div>
        </div>
      </template>
      <p x-show="bulkTags.length === 0"
         class="px-3 py-2 text-sm text-[var(--color-text-muted)]">{% translate "No tags yet." %}</p>
    </div>
  </div>

  <button type="button"
          class="text-sm text-[var(--color-text-secondary)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
          @click="clearSelection()">{% translate "Clear" %}</button>
</div>
