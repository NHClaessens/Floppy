---
name: Auto-Merge Upstream with LLM Conflict Resolution
"on":
  schedule:
    - cron: '0 * * * *'  # Runs hourly
  workflow_dispatch:     # Manual trigger

# --- CONFIGURABLE VARIABLES (set in Forgejo UI: Settings > Variables) ---
vars:
  # Git Configuration
  UPSTREAM_REPO_URL: "https://github.com/dannyvfilms/Floppy.git"
  UPSTREAM_BRANCH: "latest"
  TARGET_BRANCH: "latest"

  # Docker Registry
  FORGEJO_REGISTRY: "git.nilsc.org"
  DOCKER_IMAGE_NAME: "nils/Floppy"

  # LLM Configuration (OpenAI-compatible endpoint)
  LLM_ENDPOINT: "http://192.168.20.51:11434/v1"
  LLM_MODEL: "codellama:7b"

secrets:
  # Git (if upstream is private)
  GIT_USERNAME: ${{ secrets.GIT_USERNAME }}  # Optional
  GIT_TOKEN: ${{ secrets.GIT_TOKEN }}          # Optional

  # Docker Registry
  FORGEJO_REGISTRY_USER: ${{ secrets.FORGEJO_REGISTRY_USER }}
  FORGEJO_REGISTRY_PASSWORD: ${{ secrets.FORGEJO_REGISTRY_PASSWORD }}

  # LLM (if endpoint requires auth, e.g., OpenAI)
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}  # Optional (for OpenAI, etc.)

jobs:
  sync-upstream:
    runs-on: linux
    container: alpine/git
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream ${{ vars.UPSTREAM_REPO_URL }}
          git fetch upstream

      - name: Attempt merge
        id: merge
        run: |
          git checkout ${{ vars.TARGET_BRANCH }}
          if ! git merge upstream/${{ vars.UPSTREAM_BRANCH }} --no-edit; then
            echo "MERGE_CONFLICT=1" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: Resolve conflicts with LLM
        if: env.MERGE_CONFLICT == '1'
        run: |
          apk add python3 py3-pip git curl jq
          pip install requests
          CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
          if [ -z "$CONFLICTED_FILES" ]; then
            echo "No conflicts to resolve."
            exit 0
          fi
          for file in $CONFLICTED_FILES; do
            echo "Resolving conflicts in: $file"
            OURS=$(git show :1:"$file" | head -n -1)
            THEIRS=$(git show :3:"$file")
            cat > /tmp/conflict.txt << EOF
          Resolve the following Git merge conflict in $file:
          <<<<<<< HEAD
          $OURS
          =======
          $THEIRS
          >>>>>>> upstream/${{ vars.UPSTREAM_BRANCH }}
          Return ONLY the resolved file content without conflict markers.
          EOF
            RESOLVED_CONTENT=$(curl -s \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.LLM_API_KEY }}" \
              -d '{
                "model": "${{ vars.LLM_MODEL }}",
                "messages": [{
                  "role": "user",
                  "content": "'"$(cat /tmp/conflict.txt | jq -Rs .)"'"
                }],
                "stream": false
              }' \
              "${{ vars.LLM_ENDPOINT }}" | jq -r '.choices[0].message.content')
            echo "$RESOLVED_CONTENT" > "$file"
            git add "$file"
          done
          git config --global user.name "forgejo-runner"
          git config --global user.email "runner@forgejo.org"
          git commit -m "$(printf '%s\n' \
            "Auto-merge upstream/${{ vars.UPSTREAM_BRANCH }}" \
            "with LLM conflict resolution")"
          git push origin ${{ vars.TARGET_BRANCH }}

      - name: Build and Push Docker Image
        if: success() || steps.merge.outcome == 'success'
        run: |
          apk add docker-cli
          echo "${{ secrets.FORGEJO_REGISTRY_PASSWORD }}" | docker login \
            -u "${{ secrets.FORGEJO_REGISTRY_USER }}" \
            --password-stdin ${{ vars.FORGEJO_REGISTRY }}
          IMAGE="${{ vars.FORGEJO_REGISTRY }}/${{ vars.DOCKER_IMAGE_NAME }}"
          docker build -t "${IMAGE}:latest" .
          docker push "${IMAGE}:latest"
